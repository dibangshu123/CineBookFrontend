<!DOCTYPE html>
<html>
<head>
    <title>User Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #dcdcdc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-box {
            width: 420px;
            background-color: #e5e5e5;
            padding: 40px;
            border-radius: 25px;
            border: 2px solid #ff6b6b;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.1);
        }

        .register-box h2 {
            text-align: center;
            color: #ff4d4d;
            margin-bottom: 25px;
            font-size: 28px;
        }

        label {
            color: #ff4d4d;
            font-size: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #ff8a8a;
            background-color: #dcd0d0;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border: 1px solid #ff4d4d;
            background-color: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(to right, #ff6b6b, #ff3d3d);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(to right, #ff3d3d, #e60000);
            transform: scale(1.03);
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            color: #ff3d3d;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h2>New User Register</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter full name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter email" required>

        <label>Phone Number</label>
        <input type="text" placeholder="Enter phone number" required>

        <label>Address</label>
        <textarea rows="3" placeholder="Enter address" required></textarea>

        <label>Password</label>
        <input type="password" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm password" required>

        <button type="submit">Register</button>
    </form>

    <div class="login-link">
        Already have account? <a href="login.html">Login</a>
    </div>
</div>

</body>
</html>
