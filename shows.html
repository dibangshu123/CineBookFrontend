<!DOCTYPE html>
<html>
<head>
    <title>Select Show Time</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        h2 {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            margin: 0;
        }

        .container {
            margin-top: 40px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h3 {
            margin-bottom: 15px;
            color: #d32f2f;
        }

        .time-btn {
            padding: 12px 25px;
            margin: 10px;
            border: 2px solid #d32f2f;
            background-color: white;
            color: #d32f2f;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .time-btn:hover {
            background-color: #d32f2f;
            color: white;
        }
    </style>
</head>
<body>

<h2>Select Show Timing</h2>

<div class="container">

    <!-- Morning Shows -->
    <div class="section">
        <h3>Morning Shows</h3>

        <button class="time-btn" onclick="selectTime('10:00 AM')">10:00 AM</button>
        <button class="time-btn" onclick="selectTime('11:30 AM')">11:30 AM</button>
    </div>

    <!-- Afternoon Shows -->
    <div class="section">
        <h3>Afternoon Shows</h3>
        <button class="time-btn" onclick="selectTime('2:00 PM')">2:00 PM</button>
        <button class="time-btn" onclick="selectTime('4:30 PM')">4:30 PM</button>
    </div>

    <!-- Evening Shows -->
    <div class="section">
        <h3>Evening Shows</h3>
        <button class="time-btn" onclick="selectTime('6:30 PM')">6:30 PM</button>
        <button class="time-btn" onclick="selectTime('9:00 PM')">9:00 PM</button>
    </div>

</div>

<script>
    function selectTime(time) {
        // Store selected time
        localStorage.setItem("selectedShowTime", time);

        // Go to seat page
        window.location.href = "seat.html";
    }
</script>

</body>
</html>
