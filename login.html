<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #dcdcdc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 400px;
            background-color: #e5e5e5;
            padding: 40px;
            border-radius: 25px;
            border: 2px solid #ff6b6b;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.1);
        }

        .login-box h2 {
            text-align: center;
            color: #ff4d4d;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        label {
            color: #ff4d4d;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #ff8a8a;
            background-color: #dcd0d0;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border: 1px solid #ff4d4d;
            background-color: #ffffff;
        }

        /* Forgot Password Link */
        .forgot-link {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-link a {
            color: #ff3d3d;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(to right, #ff6b6b, #ff3d3d);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(to right, #ff3d3d, #e60000);
            transform: scale(1.03);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
        }

        .register-link a {
            color: #ff3d3d;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>User Login</h2>

    <form>
        <label>Username</label>
        <input type="text" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" placeholder="Enter password" required>

        <!-- Forgot Password Link -->
        <div class="forgot-link">
            <a href="forgot_passwd.html">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="register-link">
        New user? <a href="register.html">Register</a>
    </div>
</div>

</body>
</html>
